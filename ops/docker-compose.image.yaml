version: "3.3"

services:
  argus-front:
    image: ccr.ccs.tencentyun.com/zhangyancheng/argus-front:1.0
    container_name: argus_front
    restart: always
    ports:
      - "8000:80"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - argus_frontend

networks:
  argus_frontend:
