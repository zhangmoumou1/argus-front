version: "3.9"

services:
  argus-front:
    build:
      context: ..
      dockerfile: ops/frontend.Dockerfile
    container_name: argus_front
    restart: always
    ports:
      - "${ARGUS_FRONT_PORT:-8000}:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - argus_frontend

networks:
  argus_frontend:
    name: argus_frontend
